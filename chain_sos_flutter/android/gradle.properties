org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Temporary: disable Kotlin incremental compilation while resolving incremental storage errors
# Re-enable once builds are stable
kotlin.incremental=false
# Optionally disable Kotlin daemon to avoid stale in-memory state
kotlin.daemon.enabled=false
